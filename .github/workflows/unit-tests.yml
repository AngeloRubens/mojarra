name: Unit tests (impl)

on:
  push:
    branches:
      - 'perf-*'
    paths:
      - 'impl/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jdk21-scalar
            java: '21'
            argLine: ''
          - name: jdk21-vector
            java: '21'
            argLine: '--add-modules jdk.incubator.vector'
          - name: jdk25-vector
            java: '25'
            argLine: '--add-modules jdk.incubator.vector'
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test impl
        run: mvn -B --no-transfer-progress -f impl/pom.xml test -Dsurefire.extraArgLine="${{ matrix.argLine }}"
      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.name }}
          path: impl/target/surefire-reports/
