name: End-to-end perf (test/perf on Tomcat)

# Runs BalusC's test/perf bench (real HTTP GET/postback/ajax requests against Tomcat) on this branch,
# optionally under JFR, and optionally against MyFaces for comparison. Results land in the job summary
# and as artifacts.

on:
  push:
    branches:
      - 'perf-*'
    paths:
      - '.github/workflows/perf-e2e.yml'
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenarios (empty = all). Ajax ones end with -ajax.'
        required: false
        default: 'form-inputs-ajax,form-invalid-ajax,table-inputs-ajax,repeat-inputs-ajax,composite-inputs-ajax,foreach-inputs-ajax,table-nested-ajax,repeat-nested-ajax,composite-nested-ajax,foreach-nested-ajax,dynamic-form-ajax,dynamic-toggle-ajax'
      warmup:
        description: 'Warmup iterations per scenario'
        required: false
        default: '200'
      runs:
        description: 'Measured iterations per scenario'
        required: false
        default: '2000'
      jfr:
        description: 'Record with JFR and publish a Mojarra hot-method / allocation report'
        type: boolean
        default: true
      myfaces:
        description: 'Also run MyFaces (released version) and publish a comparison'
        type: boolean
        default: true
      myfaces_version:
        description: 'MyFaces version for the comparison arm'
        required: false
        default: '4.1.3'

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install impl and test base
        run: mvn -B -q -P '!glassfish' -pl impl,test/base -am clean install -DskipTests -Dmaven.javadoc.skip=true

      - name: Mojarra arm
        working-directory: test/perf
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios || 'form-inputs-ajax,form-invalid-ajax,table-inputs-ajax,repeat-inputs-ajax,composite-inputs-ajax,foreach-inputs-ajax,table-nested-ajax,repeat-nested-ajax,composite-nested-ajax,foreach-nested-ajax,dynamic-form-ajax,dynamic-toggle-ajax' }}
          WARMUP: ${{ github.event.inputs.warmup || '200' }}
          RUNS: ${{ github.event.inputs.runs || '2000' }}
          JFR: ${{ github.event_name == 'push' && 'true' || github.event.inputs.jfr }}
        run: |
          JVM_ARGS="-Xmx1g"
          if [ "$JFR" = "true" ]; then
            JVM_ARGS="$JVM_ARGS -XX:StartFlightRecording=filename=$GITHUB_WORKSPACE/mojarra.jfr,settings=profile,name=perf,dumponexit=true -XX:FlightRecorderOptions=stackdepth=256"
          fi
          mvn -B clean verify -Ptomcat -Dperf=true -Dperf.warmup="$WARMUP" -Dperf.runs="$RUNS" \
              -Dperf.scenarios="$SCENARIOS" -Dperf.jvmArguments="$JVM_ARGS"
          mkdir -p $GITHUB_WORKSPACE/perf-out
          cp target/perf-stats-*.txt $GITHUB_WORKSPACE/perf-out/mojarra.txt

      - name: MyFaces arm
        if: github.event_name == 'push' || github.event.inputs.myfaces == 'true'
        working-directory: test/perf
        env:
          SCENARIOS: ${{ github.event.inputs.scenarios || 'form-inputs-ajax,form-invalid-ajax,table-inputs-ajax,repeat-inputs-ajax,composite-inputs-ajax,foreach-inputs-ajax,table-nested-ajax,repeat-nested-ajax,composite-nested-ajax,foreach-nested-ajax,dynamic-form-ajax,dynamic-toggle-ajax' }}
          WARMUP: ${{ github.event.inputs.warmup || '200' }}
          RUNS: ${{ github.event.inputs.runs || '2000' }}
          MYFACES_VERSION: ${{ github.event.inputs.myfaces_version || '4.1.3' }}
        run: |
          mvn -B clean verify -Ptomcat-myfaces -Dmyfaces.version="$MYFACES_VERSION" -Dperf=true \
              -Dperf.warmup="$WARMUP" -Dperf.runs="$RUNS" -Dperf.scenarios="$SCENARIOS" -Dperf.jvmArguments="-Xmx1g"
          cp target/perf-stats-*.txt $GITHUB_WORKSPACE/perf-out/myfaces.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-e2e
          path: |
            perf-out/
            mojarra.jfr
            test/perf/target/apache-tomcat-*/logs/

      - name: Summary
        if: always()
        run: |
          {
            echo "## test/perf on Tomcat — $(nproc) vCPU, $(lscpu | grep 'Model name' | sed 's/Model name: *//')"
            echo
            if [ -f perf-out/myfaces.txt ]; then
              python3 test/perf/perfreport.py perf-out/mojarra.txt perf-out/myfaces.txt \
                  --a-label Mojarra --b-label MyFaces --title "Mojarra (this branch) vs MyFaces" --out perf-out/report.md
              cat perf-out/report.md
            elif [ -f perf-out/mojarra.txt ]; then
              echo '```'; cat perf-out/mojarra.txt; echo '```'
            fi
            echo
            if [ -f mojarra.jfr ]; then
              echo "## JFR: where Mojarra spends CPU and allocates"
              echo
              java benchmarks/ci/JfrMojarra.java mojarra.jfr 30 | tee perf-out/jfr-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

