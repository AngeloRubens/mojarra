<ui:composition
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
>
    <!-- Ten readonly columns for the table-large scenarios: plain EL text, converters, computed EL, attributes, links. -->
    <h:column><f:facet name="header">#</f:facet>#{row.id}</h:column>
    <h:column><f:facet name="header">Name</f:facet>#{row.name}</h:column>
    <h:column><f:facet name="header">Description</f:facet>#{row.description}</h:column>
    <h:column><f:facet name="header">Qty</f:facet>#{row.quantity}</h:column>
    <h:column>
        <f:facet name="header">Price</f:facet>
        <h:outputText value="#{row.price}">
            <f:convertNumber type="currency" currencyCode="EUR"/>
        </h:outputText>
    </h:column>
    <h:column>
        <f:facet name="header">Total</f:facet>
        <h:outputText value="#{row.price * row.quantity}">
            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
        </h:outputText>
    </h:column>
    <h:column>
        <f:facet name="header">Date</f:facet>
        <h:outputText value="#{row.date}">
            <f:convertDateTime type="localDate"/>
        </h:outputText>
    </h:column>
    <h:column><f:facet name="header">Active</f:facet>#{row.active}</h:column>
    <h:column>
        <f:facet name="header">Status</f:facet>
        <h:outputText value="#{row.active ? 'Enabled' : 'Disabled'}" styleClass="#{row.active ? 'status on' : 'status off'}" title="#{row.name}"/>
    </h:column>
    <h:column>
        <f:facet name="header">Link</f:facet>
        <h:outputLink value="#row-#{row.id}" title="Details of #{row.name}">Details</h:outputLink>
    </h:column>
</ui:composition>
